<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thẻ Học & Luyện Nghe Tiếng Anh 5 - Global Success (Unit 1 - 5)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
      min-height: 100vh;
    }
    .unit-tab.active {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: white;
      box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
      transform: translateY(-2px);
    }
    .sub-tab.active {
      border-bottom: 3px solid #4f46e5;
      color: #4f46e5;
      font-weight: 800;
    }
    .pulse-btn:active {
      transform: scale(0.96);

</head>

      </div>
      
      <!-- Audio Player Control -->

        <span class="text-xs font-bold text-slate-600">Tốc độ:</span>
        <button id="speed-normal" onclick="setSpeed(1.0)" class="px-3 py-1.5 rounded-xl text-xs font-extrabold bg-indigo-600 text-white shadow-sm transition">1.0x Chuẩn</button>

      </div>
    </header>

    <!-- Hidden Audio Players -->
    <audio id="app-audio-player" playsinline preload="none" class="hidden"></audio>
    <audio id="bg-music-player" loop preload="none" class="hidden"></audio>

    <!-- Audio Status Toast -->
    <div id="audio-toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 z-50 text-sm font-semibold backdrop-blur-md border border-slate-700">

      <span id="toast-msg">Đang phát âm...</span>

    </div>

    <!-- Unit Navigation Tabs (Unit 1 to 5) -->

    <!-- Unit Title Banner -->

// Application Logic for English Grade 5 Global Success Flashcard App

let activeUnitId = 1;
let activeTab = 'vocab';
let currentSpeed = 1.0;
let selectedVocabIdx = 0;
let isChantPlayingAll = false;
let chantQueue = [];
let chantIndex = 0;
let isBgMusicPlaying = false;
let showVideoModal = false;

// Load learned items from localStorage
function getLearnedSet() {
  try {
    const raw = localStorage.getItem('g5_learned_items');
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) {
    return new Set();
  }
}

function saveLearned(id) {
  const set = getLearnedSet();
  set.add(id);
  localStorage.setItem('g5_learned_items', JSON.stringify(Array.from(set)));
  updateProgressDisplay();
}

function isLearned(id) {
  return getLearnedSet().has(id);
}

// Background Music Control
function toggleBgMusic() {
  const bgPlayer = document.getElementById('bg-music-player');
  const btn = document.getElementById('btn-toggle-bg-music');
  const indicator = document.getElementById('bg-music-indicator');
  if (!bgPlayer) return;

  if (isBgMusicPlaying) {
    bgPlayer.pause();
    isBgMusicPlaying = false;
    if (btn) {
      btn.innerHTML = '<span>🎵 Bật Nhạc Nền Vui Nhộn</span>';
      btn.className = 'pulse-btn px-4 py-2 bg-pink-100 hover:bg-pink-200 text-pink-700 rounded-2xl text-xs sm:text-sm font-extrabold flex items-center gap-1.5 transition';
    }
    if (indicator) indicator.classList.add('hidden');
  } else {
    const u = currentUnit();
    if (u && u.song && u.song.bgMusic) {
      bgPlayer.src = u.song.bgMusic;
    }
    bgPlayer.volume = 0.35; // Comfortable background volume
    bgPlayer.play().then(() => {
      isBgMusicPlaying = true;
      if (btn) {
        btn.innerHTML = '<span class="animate-bounce">⏸️</span> <span>Tắt Nhạc Nền</span>';
        btn.className = 'pulse-btn px-4 py-2 bg-pink-600 hover:bg-pink-700 text-white rounded-2xl text-xs sm:text-sm font-extrabold flex items-center gap-1.5 transition shadow-sm';
      }
      if (indicator) indicator.classList.remove('hidden');
    }).catch(e => {
      console.log('Bg music playback error:', e);
    });
  }
}

function setBgVolume(val) {
  const bgPlayer = document.getElementById('bg-music-player');
  if (bgPlayer) {
    bgPlayer.volume = parseFloat(val);
  }
}

// Audio Engine (Google Translate TTS for Speech)
function playAudio(text, customSpeed) {
  stopVocalAudio();
  const player = document.getElementById('app-audio-player');
  const toast = document.getElementById('audio-toast');
  const toastMsg = document.getElementById('toast-msg');

  if (!player) return;

  const rate = customSpeed || currentSpeed;
  const q = encodeURIComponent(text.trim());
  const url = 'https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=' + q;

  player.src = url;
  player.playbackRate = rate;

  if (toast && toastMsg) {
    toastMsg.textContent = '🔊 Đang đọc: "' + (text.length > 35 ? text.substring(0, 35) + '...' : text) + '"';
    toast.classList.remove('hidden');
    toast.classList.add('flex');
  }

  player.onended = function() {
    if (toast) {
      toast.classList.add('hidden');
      toast.classList.remove('flex');
    }
    if (isChantPlayingAll) {
      playNextChantLine();
    }
  };

  player.onerror = function() {
    if (toast) {
      toast.classList.add('hidden');
      toast.classList.remove('flex');
    }
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = rate;
      window.speechSynthesis.speak(u);
    }
  };

  player.play().catch(e => {
    console.log('Audio autoplay prevented:', e);
  });
}

function stopVocalAudio() {
  const player = document.getElementById('app-audio-player');
  if (player) {
    player.pause();
    player.currentTime = 0;
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  const toast = document.getElementById('audio-toast');
  if (toast) {
    toast.classList.add('hidden');
    toast.classList.remove('flex');
  }
}

function stopAudio() {
  isChantPlayingAll = false;
  stopVocalAudio();
  // unhighlight all chant lines
  document.querySelectorAll('[id^="chant-line-"]').forEach(el => {
    el.classList.remove('bg-pink-100', 'border-pink-500', 'ring-2', 'ring-pink-400');
  });
}

function setSpeed(speed) {
  currentSpeed = speed;
  const btnNorm = document.getElementById('speed-normal');
  const btnSlow = document.getElementById('speed-slow');

  if (speed === 1.0) {
    btnNorm.className = 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-indigo-600 text-white shadow-sm transition';
    btnSlow.className = 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-white text-slate-700 hover:bg-slate-100 border border-slate-200 transition';
  } else {
    btnSlow.className = 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-indigo-600 text-white shadow-sm transition';
    btnNorm.className = 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-white text-slate-700 hover:bg-slate-100 border border-slate-200 transition';
  }
}

// Navigation & Tab Switching
function selectUnit(unitId) {
  activeUnitId = unitId;
  selectedVocabIdx = 0;
  showVideoModal = false;
  stopAudio();
  renderUnitNav();
  renderUnitBanner();
  renderContent();
  // Update background music src if playing
  if (isBgMusicPlaying) {
    const bgPlayer = document.getElementById('bg-music-player');
    const u = currentUnit();
    if (bgPlayer && u && u.song && u.song.bgMusic) {
      bgPlayer.src = u.song.bgMusic;
      bgPlayer.play().catch(e => console.log(e));
    }
  }
}

function switchTab(tabName) {
  activeTab = tabName;
  stopAudio();
  const tabs = ['vocab', 'sentences', 'grammar', 'practice', 'song'];
  tabs.forEach(t => {
    const btn = document.getElementById('tab-btn-' + t);
    if (btn) {
      if (t === tabName) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }
  });
  renderContent();
}

function currentUnit() {
  return APP_UNITS.find(u => u.id === activeUnitId) || APP_UNITS[0];
}

function selectVocabWord(idx) {
  selectedVocabIdx = idx;
  const u = currentUnit();
  if (u && u.vocab[idx]) {
    playAudio(u.vocab[idx].word);
  }
  renderContent();
  const showcase = document.getElementById('big-vocab-showcase');
  if (showcase && window.innerWidth < 640) {
    showcase.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

// Render Header & Navigation
function renderUnitNav() {
  const nav = document.getElementById('unit-nav');
  if (!nav) return;

  nav.innerHTML = APP_UNITS.map(u => {
    const isActive = u.id === activeUnitId;
    return `
      <button onclick="selectUnit(${u.id})" class="unit-tab p-3 rounded-2xl font-black text-xs sm:text-sm flex items-center justify-center gap-1.5 transition ${isActive ? 'active' : 'bg-white text-slate-700 hover:bg-slate-50 border border-slate-200 shadow-sm'}">
        <span class="text-base sm:text-lg">${u.icon}</span>
        <span>Unit ${u.id}</span>
      </button>
    `;
  }).join('');
}

function renderUnitBanner() {
  const banner = document.getElementById('unit-banner');
  if (!banner) return;
  const u = currentUnit();
  banner.className = `bg-gradient-to-r ${u.themeColor} rounded-3xl p-5 sm:p-6 text-white shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3`;
  banner.innerHTML = `

    </div>

function updateProgressDisplay() {
  const badge = document.getElementById('unit-progress-badge');
  if (!badge) return;
  const u = currentUnit();
  const set = getLearnedSet();
  
  let total = u.vocab.length + u.sentences.length + u.practice.length;
  let done = 0;

  u.vocab.forEach(v => { if (set.has('u' + u.id + '_v_' + v.word)) done++; });
  u.sentences.forEach((s, idx) => { if (set.has('u' + u.id + '_s_' + idx)) done++; });
  u.practice.forEach((p, idx) => { if (set.has('u' + u.id + '_p_' + idx)) done++; });

  badge.innerHTML = `⭐ Đã thuộc: ${done}/${total} mục (${Math.round((done/total)*100)}%)`;
}

// Toggle YouTube Video Container
function toggleVideoEmbed() {
  const container = document.getElementById('youtube-video-container');
  const btn = document.getElementById('btn-toggle-video');
  if (!container) return;

  if (container.classList.contains('hidden')) {
    container.classList.remove('hidden');
    if (btn) btn.innerHTML = '<span>✕ Thu gọn Video</span>';
  } else {
    container.classList.add('hidden');
    if (btn) btn.innerHTML = '<span>🎬 Xem Video Hoạt Hình Ca Nhạc (YouTube)</span>';
  }
}

function toggleAnswer(idx) {
  const box = document.getElementById('ans-box-' + idx);
  const btn = document.getElementById('btn-show-ans-' + idx);
  if (!box || !btn) return;

  if (box.classList.contains('hidden')) {
    box.classList.remove('hidden');
    btn.textContent = 'Ẩn đáp án';
    // Automatically speak the answer once when opened!
    const u = currentUnit();
    if (u.practice[idx]) {
      playAudio(u.practice[idx].en);
    }
  } else {
    box.classList.add('hidden');
    btn.textContent = '👁️ Xem đáp án';
  }
}

function markPracticeLearned(id, idx) {
  saveLearned(id);
  const btn = document.getElementById('btn-mark-' + idx);
  if (btn) {
    btn.className = 'pulse-btn px-3.5 py-2 rounded-xl text-xs font-extrabold bg-amber-100 text-amber-800 transition';
    btn.innerHTML = '<span>⭐ Đã thuộc câu này</span>';
  }
}

function playFullChant() {
  const u = currentUnit();
  chantQueue = u.song.lines.map(l => l.en);
  chantIndex = 0;
  isChantPlayingAll = true;

  // Also start background music softly if not already playing!
  const bgPlayer = document.getElementById('bg-music-player');
  if (bgPlayer && !isBgMusicPlaying) {
    toggleBgMusic();
  }

  playNextChantLine();
}

function playNextChantLine() {
  if (!isChantPlayingAll || chantIndex >= chantQueue.length) {
    isChantPlayingAll = false;
    document.querySelectorAll('[id^="chant-line-"]').forEach(el => {
      el.classList.remove('bg-pink-100', 'border-pink-500', 'ring-2', 'ring-pink-400');
    });
    return;
  }

  // Highlight active chant line
  document.querySelectorAll('[id^="chant-line-"]').forEach(el => {
    el.classList.remove('bg-pink-100', 'border-pink-500', 'ring-2', 'ring-pink-400');
  });
  const activeEl = document.getElementById('chant-line-' + chantIndex);
  if (activeEl) {
    activeEl.classList.add('bg-pink-100', 'border-pink-500', 'ring-2', 'ring-pink-400');
    activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  const text = chantQueue[chantIndex];
  chantIndex++;
  playAudio(text);
}

// Initial boot
window.addEventListener('DOMContentLoaded', () => {
  renderUnitNav();
  renderUnitBanner();
  renderContent();
});
