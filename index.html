// Application Logic for English Grade 5 Global Success Flashcard App (Classroom Big Picture Edition)

let activeUnitId = 1;
let activeTab = 'vocab';
let currentSpeed = 1.0;
let selectedVocabIdx = 0;
let isChantPlayingAll = false;
let chantQueue = [];
let chantIndex = 0;
let isBgMusicPlaying = false;
let showVideoModal = false;

// Load learned items from localStorage
function getLearnedSet() {
  try {
    const raw = localStorage.getItem('g5_learned_items');
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) {
    return new Set();
  }
}

function saveLearned(id) {
  const set = getLearnedSet();
  if (set.has(id)) {
    set.delete(id);
  } else {
    set.add(id);
  }
  localStorage.setItem('g5_learned_items', JSON.stringify(Array.from(set)));
  updateProgressDisplay();
  renderContent();
}

function isLearned(id) {
  return getLearnedSet().has(id);
}

// Background Music Control
function toggleBgMusic() {
  const bgPlayer = document.getElementById('bg-music-player');
  const btn = document.getElementById('btn-toggle-bg-music');
  const indicator = document.getElementById('bg-music-indicator');
  if (!bgPlayer) return;

  if (isBgMusicPlaying) {
    bgPlayer.pause();
    isBgMusicPlaying = false;
    if (btn) {
      btn.innerHTML = '<span>🎵 Bật Nhạc Nền Vui Nhộn</span>';
      btn.className = 'pulse-btn px-4 py-2 bg-pink-100 hover:bg-pink-200 text-pink-700 rounded-2xl text-xs sm:text-sm font-black flex items-center gap-1.5 transition';
    }
    if (indicator) indicator.classList.add('hidden');
  } else {
    const u = currentUnit();
    if (u && u.song && u.song.bgMusic) {
      bgPlayer.src = u.song.bgMusic;
    }
    bgPlayer.volume = 0.35;
    bgPlayer.play().then(() => {
      isBgMusicPlaying = true;
      if (btn) {
        btn.innerHTML = '<span class="animate-bounce">⏸️</span> <span>Tắt Nhạc Nền</span>';
        btn.className = 'pulse-btn px-4 py-2 bg-pink-600 hover:bg-pink-700 text-white rounded-2xl text-xs sm:text-sm font-black flex items-center gap-1.5 transition shadow-sm';
      }
      if (indicator) indicator.classList.remove('hidden');
    }).catch(e => {
      console.log('Bg music playback error:', e);
    });
  }
}

function setBgVolume(val) {
  const bgPlayer = document.getElementById('bg-music-player');
  if (bgPlayer) {
    bgPlayer.volume = parseFloat(val);
  }
}

// Audio Engine (Google Translate TTS for Speech)
function playAudio(text, customSpeed) {
  stopVocalAudio();
  const player = document.getElementById('app-audio-player');
  const toast = document.getElementById('audio-toast');
  const toastMsg = document.getElementById('toast-msg');

  if (!player) return;

  const rate = customSpeed || currentSpeed;
  const q = encodeURIComponent(text.trim());
  const url = 'https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=' + q;

  player.src = url;
  player.playbackRate = rate;

  if (toast && toastMsg) {
    toastMsg.textContent = '🔊 Đang đọc: "' + (text.length > 35 ? text.substring(0, 35) + '...' : text) + '"';
    toast.classList.remove('hidden');
    toast.classList.add('flex');
  }

  player.onended = function() {
    if (toast) {
      toast.classList.add('hidden');
      toast.classList.remove('flex');
    }
    if (isChantPlayingAll) {
      playNextChantLine();
    }
  };

  player.onerror = function() {
    if (toast) {
      toast.classList.add('hidden');
      toast.classList.remove('flex');
    }
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = rate;
      window.speechSynthesis.speak(u);
    }
  };

  player.play().catch(e => {
    console.log('Audio autoplay prevented:', e);
  });
}

function stopVocalAudio() {
  const player = document.getElementById('app-audio-player');
  if (player) {
    player.pause();
    player.currentTime = 0;
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  const toast = document.getElementById('audio-toast');
  if (toast) {
    toast.classList.add('hidden');
    toast.classList.remove('flex');
  }
}

function stopAudio() {
  isChantPlayingAll = false;
  stopVocalAudio();
  document.querySelectorAll('[id^="chant-line-"]').forEach(el => {
    el.classList.remove('bg-pink-100', 'border-pink-500', 'ring-2', 'ring-pink-400');
  });
}

function setSpeed(speed) {
  currentSpeed = speed;
  const btnNorm = document.getElementById('speed-normal');
  const btnSlow = document.getElementById('speed-slow');

  if (speed === 1.0) {
    if (btnNorm) btnNorm.className = 'px-3 py-1.5 rounded-xl text-xs font-black bg-indigo-600 text-white shadow-sm transition';
    if (btnSlow) btnSlow.className = 'px-3 py-1.5 rounded-xl text-xs font-black bg-white text-slate-700 hover:bg-slate-100 border border-slate-200 transition';
  } else {
    if (btnSlow) btnSlow.className = 'px-3 py-1.5 rounded-xl text-xs font-black bg-indigo-600 text-white shadow-sm transition';
    if (btnNorm) btnNorm.className = 'px-3 py-1.5 rounded-xl text-xs font-black bg-white text-slate-700 hover:bg-slate-100 border border-slate-200 transition';
  }
}

// Navigation & Tab Switching
function selectUnit(unitId) {
  activeUnitId = unitId;
  selectedVocabIdx = 0;
  showVideoModal = false;
  stopAudio();
  renderUnitNav();
  renderUnitBanner();
  renderContent();
  if (isBgMusicPlaying) {
    const bgPlayer = document.getElementById('bg-music-player');
    const u = currentUnit();
    if (bgPlayer && u && u.song && u.song.bgMusic) {
      bgPlayer.src = u.song.bgMusic;
      bgPlayer.play().catch(e => console.log(e));
    }
  }
}

function switchTab(tabName) {
  activeTab = tabName;
  stopAudio();
  const tabs = ['vocab', 'sentences', 'grammar', 'practice', 'song'];
  tabs.forEach(t => {
    const btn = document.getElementById('tab-btn-' + t);
    if (btn) {
      if (t === tabName) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }
  });
  renderContent();
}

function currentUnit() {
  return APP_UNITS.find(u => u.id === activeUnitId) || APP_UNITS[0];
}

function selectVocabWord(idx) {
  selectedVocabIdx = idx;
  const u = currentUnit();
  if (u && u.vocab[idx]) {
    playAudio(u.vocab[idx].word);
  }
  renderContent();
  const showcase = document.getElementById('big-vocab-showcase');
  if (showcase && window.innerWidth < 640) {
    showcase.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function nextWord() {
  const u = currentUnit();
  selectedVocabIdx = (selectedVocabIdx + 1) % u.vocab.length;
  playAudio(u.vocab[selectedVocabIdx].word);
  renderContent();
}

function prevWord() {
  const u = currentUnit();
  selectedVocabIdx = (selectedVocabIdx - 1 + u.vocab.length) % u.vocab.length;
  playAudio(u.vocab[selectedVocabIdx].word);
  renderContent();
}

function playAudioCurrentWord() {
  const u = currentUnit();
  const v = u.vocab[selectedVocabIdx];
  if (v) playAudio(v.word);
}

function playAudioCurrentSentence() {
  const u = currentUnit();
  const v = u.vocab[selectedVocabIdx];
  if (v && v.example) playAudio(v.example);
}

// Render Header & Navigation
function renderUnitNav() {
  const nav = document.getElementById('unit-nav');
  if (!nav) return;

  nav.innerHTML = APP_UNITS.map(u => {
    const isActive = u.id === activeUnitId;
    return `
      <button onclick="selectUnit(${u.id})" class="unit-tab p-3 rounded-2xl font-black text-xs sm:text-sm flex items-center justify-center gap-1.5 transition ${isActive ? 'active' : 'bg-white text-slate-700 hover:bg-slate-50 border border-slate-200 shadow-sm'}">
        <span class="text-base sm:text-lg">${u.icon}</span>
        <span>Unit ${u.id}</span>
      </button>
    `;
  }).join('');
}

function renderUnitBanner() {
  const banner = document.getElementById('unit-banner');
  if (!banner) return;
  const u = currentUnit();
  banner.className = `bg-gradient-to-r ${u.themeColor} rounded-3xl p-5 sm:p-6 text-white shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3`;
  banner.innerHTML = `
    <div>
      <span class="inline-block px-2.5 py-0.5 bg-white/20 rounded-md text-xs font-bold uppercase tracking-wide">Chương trình Tiếng Anh 5 Global Success</span>
      <h2 class="text-xl sm:text-2xl font-black mt-1">${u.title}</h2>
      <p class="text-xs sm:text-sm text-white/90 font-medium">${u.subtitle}</p>
    </div>
    <div id="unit-progress-badge" class="bg-white/20 backdrop-blur-md px-3.5 py-2 rounded-2xl text-xs font-black flex items-center gap-2">
      <span>⭐ Tiến độ: Đang tải...</span>
    </div>
  `;
  updateProgressDisplay();
}

function updateProgressDisplay() {
  const badge = document.getElementById('unit-progress-badge');
  if (!badge) return;
  const u = currentUnit();
  const set = getLearnedSet();
  
  let total = u.vocab.length + u.sentences.length + u.practice.length;
  let done = 0;

  u.vocab.forEach(v => { if (set.has('u' + u.id + '_v_' + v.word)) done++; });
  u.sentences.forEach((s, idx) => { if (set.has('u' + u.id + '_s_' + idx)) done++; });
  u.practice.forEach((p, idx) => { if (set.has('u' + u.id + '_p_' + idx)) done++; });

  badge.innerHTML = `⭐ Đã thuộc: ${done}/${total} mục (${Math.round((done/total)*100)}%)`;
}

// Toggle YouTube Video Container
function toggleVideoEmbed() {
  const container = document.getElementById('youtube-video-container');
  const btn = document.getElementById('btn-toggle-video');
  if (!container) return;

  if (container.classList.contains('hidden')) {
    container.classList.remove('hidden');
    if (btn) btn.innerHTML = '<span>✕ Thu gọn Video</span>';
  } else {
    container.classList.add('hidden');
    if (btn) btn.innerHTML = '<span>🎬 Xem Video Hoạt Hình Ca Nhạc (YouTube)</span>';
  }
}

  const ansEl = document.getElementById('practice-ans-' + idx);

  } else if (activeTab === 'sentences') {

            const learned = isLearned(pId);
            return `

                <div class="space-y-2 pt-2 border-t border-slate-100">
                  <div id="practice-ans-${idx}" class="hidden space-y-2">
                    <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-xs sm:text-sm font-black text-emerald-900">

                        <span>🔊 Phát âm</span>

                  </div>

                  <button id="practice-btn-${idx}" onclick="togglePracticeAnswer(${idx})" class="w-full py-2 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 rounded-xl text-xs font-black transition">
                    <span>👁️ Xem đáp án &amp; Phát âm</span>

          }).join('')}
        </div>
      </div>
    `;
  } else if (activeTab === 'song') {
    main.innerHTML = `
      <div class="space-y-5">
        
        <!-- Video & Music Header Banner -->
        <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-sm space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-pink-100 text-pink-700 rounded-full text-xs font-black uppercase tracking-wider">
                <span>🎵 Ca Khúc &amp; Giai Điệu SGK</span>
              </div>

            <input type="range" min="0" max="1" step="0.05" value="0.35" onchange="setBgVolume(this.value)" class="w-36 accent-pink-600 cursor-pointer" />

              <p class="text-xs text-slate-500 font-bold">Chạm vào từng câu để nghe hát mẫu hoặc bấm Hát Cả Bài</p>

              </button>

                </button>
              </div>
            `).join('')}
          </div>
        </div>

      </div>
    `;
  }
}

// Karaoke chant all player
function playChantAll() {
  const u = currentUnit();
  if (!u || !u.song || !u.song.lines) return;

  chantQueue = u.song.lines.map(l => l.en);
  chantIndex = 0;
  isChantPlayingAll = true;

  if (!isBgMusicPlaying) {
    toggleBgMusic();
  }

  playNextChantLine();
}

function playNextChantLine() {
  if (!isChantPlayingAll || chantIndex >= chantQueue.length) {
    isChantPlayingAll = false;
    document.querySelectorAll('[id^="chant-line-"]').forEach(el => {
      el.classList.remove('bg-pink-100', 'border-pink-500', 'ring-2', 'ring-pink-400');
    });
    return;
  }

  document.querySelectorAll('[id^="chant-line-"]').forEach(el => {
    el.classList.remove('bg-pink-100', 'border-pink-500', 'ring-2', 'ring-pink-400');
  });
  const activeEl = document.getElementById('chant-line-' + chantIndex);
  if (activeEl) {
    activeEl.classList.add('bg-pink-100', 'border-pink-500', 'ring-2', 'ring-pink-400');
    activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  const text = chantQueue[chantIndex];
  chantIndex++;
  playAudio(text);
}

// Keyboard shortcuts for wireless clickers & presentation remotes
window.addEventListener('keydown', (e) => {
  if (activeTab === 'vocab') {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') {
      nextWord();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      prevWord();
    } else if (e.key === ' ') {
      playAudioCurrentWord();
    }
  }
});

// Initial boot
window.addEventListener('DOMContentLoaded', () => {
  renderUnitNav();
  renderUnitBanner();
  renderContent();
});

  </script>
