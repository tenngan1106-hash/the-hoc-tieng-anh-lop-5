// Application Logic for English Grade 5 Global Success Flashcard App

let activeUnitId = 1;
let activeTab = 'vocab';
let currentSpeed = 1.0;
let isChantPlayingAll = false;
let chantQueue = [];
let chantIndex = 0;

// Load learned items from localStorage
function getLearnedSet() {
  try {
    const raw = localStorage.getItem('g5_learned_items');
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) {
    return new Set();
  }
}

function saveLearned(id) {
  const set = getLearnedSet();
  set.add(id);
  localStorage.setItem('g5_learned_items', JSON.stringify(Array.from(set)));
  updateProgressDisplay();
}

function isLearned(id) {
  return getLearnedSet().has(id);
}

// Audio Engine (Google Translate TTS)
function playAudio(text, customSpeed) {
  stopAudio();
  const player = document.getElementById('app-audio-player');
  const toast = document.getElementById('audio-toast');
  const toastMsg = document.getElementById('toast-msg');

  if (!player) return;

  const rate = customSpeed || currentSpeed;
  const q = encodeURIComponent(text.trim());
  const url = 'https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=' + q;

  player.src = url;
  player.playbackRate = rate;

  if (toast && toastMsg) {
    toastMsg.textContent = '🔊 Đang đọc: "' + (text.length > 35 ? text.substring(0, 35) + '...' : text) + '"';
    toast.classList.remove('hidden');
    toast.classList.add('flex');
  }

  player.onended = function() {
    if (toast) {
      toast.classList.add('hidden');
      toast.classList.remove('flex');
    }
    if (isChantPlayingAll) {
      playNextChantLine();
    }
  };

  player.onerror = function() {
    if (toast) {
      toast.classList.add('hidden');
      toast.classList.remove('flex');
    }
    // Fallback: Web Speech API if network TTS blocked
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = rate;
      window.speechSynthesis.speak(u);
    }
  };

  player.play().catch(e => {
    console.log('Audio autoplay prevented:', e);
  });
}

function stopAudio() {
  isChantPlayingAll = false;
  const player = document.getElementById('app-audio-player');
  if (player) {
    player.pause();
    player.currentTime = 0;
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  const toast = document.getElementById('audio-toast');
  if (toast) {
    toast.classList.add('hidden');
    toast.classList.remove('flex');
  }
}

function setSpeed(speed) {
  currentSpeed = speed;
  const btnNorm = document.getElementById('speed-normal');
  const btnSlow = document.getElementById('speed-slow');

  if (speed === 1.0) {
    btnNorm.className = 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-indigo-600 text-white shadow-sm transition';
    btnSlow.className = 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-white text-slate-700 hover:bg-slate-100 border border-slate-200 transition';
  } else {
    btnSlow.className = 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-indigo-600 text-white shadow-sm transition';
    btnNorm.className = 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-white text-slate-700 hover:bg-slate-100 border border-slate-200 transition';
  }
}

// Navigation & Tab Switching
function selectUnit(unitId) {
  activeUnitId = unitId;
  stopAudio();
  renderUnitNav();
  renderUnitBanner();
  renderContent();
}

function switchTab(tabName) {
  activeTab = tabName;
  stopAudio();
  const tabs = ['vocab', 'sentences', 'grammar', 'practice', 'song'];
  tabs.forEach(t => {
    const btn = document.getElementById('tab-btn-' + t);
    if (btn) {
      if (t === tabName) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }
  });
  renderContent();
}

function currentUnit() {
  return APP_UNITS.find(u => u.id === activeUnitId) || APP_UNITS[0];
}

// Render Header & Navigation
function renderUnitNav() {
  const nav = document.getElementById('unit-nav');
  if (!nav) return;

  nav.innerHTML = APP_UNITS.map(u => {
    const isActive = u.id === activeUnitId;
    return `
      <button onclick="selectUnit(${u.id})" class="unit-tab p-3 rounded-2xl font-black text-xs sm:text-sm flex items-center justify-center gap-1.5 transition ${isActive ? 'active' : 'bg-white text-slate-700 hover:bg-slate-50 border border-slate-200 shadow-sm'}">
        <span class="text-base sm:text-lg">${u.icon}</span>
        <span>Unit ${u.id}</span>
      </button>
    `;
  }).join('');
}

function renderUnitBanner() {
  const banner = document.getElementById('unit-banner');
  if (!banner) return;
  const u = currentUnit();
  banner.className = `bg-gradient-to-r ${u.themeColor} rounded-3xl p-5 sm:p-6 text-white shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3`;
  banner.innerHTML = `
    <div>
      <span class="inline-block px-2.5 py-0.5 bg-white/20 rounded-md text-xs font-bold uppercase tracking-wide">Chương trình Tiếng Anh 5</span>
      <h2 class="text-xl sm:text-2xl font-black mt-1">${u.title}</h2>
      <p class="text-xs sm:text-sm text-white/90 font-medium">${u.subtitle}</p>
    </div>
    <div id="unit-progress-badge" class="bg-white/20 backdrop-blur-md px-3.5 py-2 rounded-2xl text-xs font-extrabold flex items-center gap-2">
      <span>⭐ Tiến độ: Đang tải...</span>
    </div>
  `;
  updateProgressDisplay();
}

function updateProgressDisplay() {
  const badge = document.getElementById('unit-progress-badge');
  if (!badge) return;
  const u = currentUnit();
  const set = getLearnedSet();
  
  let total = u.vocab.length + u.sentences.length + u.practice.length;
  let done = 0;

  u.vocab.forEach(v => { if (set.has('u' + u.id + '_v_' + v.word)) done++; });
  u.sentences.forEach((s, idx) => { if (set.has('u' + u.id + '_s_' + idx)) done++; });
  u.practice.forEach((p, idx) => { if (set.has('u' + u.id + '_p_' + idx)) done++; });

  badge.innerHTML = `⭐ Đã thuộc: ${done}/${total} mục (${Math.round((done/total)*100)}%)`;
}

                <div class="text-xs font-medium text-slate-500 italic">${line.vi}</div>
              </div>
              <button onclick="playAudio('${line.en.replace(/'/g, "\\'")}')" class="pulse-btn px-3 py-1.5 bg-white hover:bg-pink-100 text-pink-600 border border-slate-200 rounded-xl text-xs font-bold transition flex items-center gap-1 shadow-2xs whitespace-nowrap">
                <span>🔊 Nghe câu này</span>
              </button>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
}

function toggleAnswer(idx) {
  const box = document.getElementById('ans-box-' + idx);
  const btn = document.getElementById('btn-show-ans-' + idx);
  if (!box || !btn) return;

  if (box.classList.contains('hidden')) {
    box.classList.remove('hidden');
    btn.textContent = 'Ẩn đáp án';
    // Automatically speak the answer once when opened!
    const u = currentUnit();
    if (u.practice[idx]) {
      playAudio(u.practice[idx].en);
    }
  } else {
    box.classList.add('hidden');
    btn.textContent = '👁️ Xem đáp án';
  }
}

function markPracticeLearned(id, idx) {
  saveLearned(id);
  const btn = document.getElementById('btn-mark-' + idx);
  if (btn) {
    btn.className = 'pulse-btn px-3.5 py-2 rounded-xl text-xs font-extrabold bg-amber-100 text-amber-800 transition';
    btn.innerHTML = '<span>⭐ Đã thuộc câu này</span>';
  }
}

function playFullChant() {
  const u = currentUnit();
  chantQueue = u.song.lines.map(l => l.en);
  chantIndex = 0;
  isChantPlayingAll = true;
  playNextChantLine();
}

function playNextChantLine() {
  if (!isChantPlayingAll || chantIndex >= chantQueue.length) {
    isChantPlayingAll = false;
    return;
  }
  const text = chantQueue[chantIndex];
  chantIndex++;
  playAudio(text);
}

// Initial boot
window.addEventListener('DOMContentLoaded', () => {
  renderUnitNav();
  renderUnitBanner();
  renderContent();
});

  </script>
</body>
</html>
