// Application Logic for English Grade 5 Global Success Flashcard App (Classroom Big Picture Edition)

let activeUnitId = 1;
let activeTab = 'vocab';
let currentSpeed = 1.0;
let selectedVocabIdx = 0;

// Quiz State
let currentQuizIdx = 0;
let quizScore = 0;
let quizAnswered = false;
let selectedQuizOption = null;

// Load learned items from localStorage
function getLearnedSet() {
  try {
    const raw = localStorage.getItem('g5_learned_items');
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) {
    return new Set();
  }
}

function saveLearned(id) {
  const set = getLearnedSet();
  if (set.has(id)) {
    set.delete(id);
  } else {
    set.add(id);
  }
  localStorage.setItem('g5_learned_items', JSON.stringify(Array.from(set)));
  updateProgressDisplay();
  renderContent();
}

function isLearned(id) {
  return getLearnedSet().has(id);
}

// Audio Engine (Google Translate TTS for Speech)
function playAudio(text, customSpeed) {
  stopVocalAudio();
  const player = document.getElementById('app-audio-player');
  const toast = document.getElementById('audio-toast');
  const toastMsg = document.getElementById('toast-msg');

  if (!player) return;

  const rate = customSpeed || currentSpeed;
  const q = encodeURIComponent(text.trim());
  const url = 'https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=' + q;

  player.src = url;
  player.playbackRate = rate;

  if (toast && toastMsg) {
    toastMsg.textContent = '🔊 Đang đọc: "' + (text.length > 35 ? text.substring(0, 35) + '...' : text) + '"';
    toast.classList.remove('hidden');
    toast.classList.add('flex');
  }

  player.onended = function() {
    if (toast) {
      toast.classList.add('hidden');
      toast.classList.remove('flex');
    }
  };

  player.onerror = function() {
    if (toast) {
      toast.classList.add('hidden');
      toast.classList.remove('flex');
    }
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = rate;
      window.speechSynthesis.speak(u);
    }
  };

  player.play().catch(e => {
    console.log('Audio autoplay prevented:', e);
  });
}

function stopVocalAudio() {
  const player = document.getElementById('app-audio-player');
  if (player) {
    player.pause();
    player.currentTime = 0;
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  const toast = document.getElementById('audio-toast');
  if (toast) {
    toast.classList.add('hidden');
    toast.classList.remove('flex');
  }
}

function stopAudio() {
  stopVocalAudio();
}

function setSpeed(speed) {
  currentSpeed = speed;
  const btnNorm = document.getElementById('speed-normal');
  const btnSlow = document.getElementById('speed-slow');

  if (speed === 1.0) {
    if (btnNorm) btnNorm.className = 'px-3 py-1.5 rounded-xl text-xs font-black bg-indigo-600 text-white shadow-sm transition';
    if (btnSlow) btnSlow.className = 'px-3 py-1.5 rounded-xl text-xs font-black bg-white text-slate-700 hover:bg-slate-100 border border-slate-200 transition';
  } else {
    if (btnSlow) btnSlow.className = 'px-3 py-1.5 rounded-xl text-xs font-black bg-indigo-600 text-white shadow-sm transition';
    if (btnNorm) btnNorm.className = 'px-3 py-1.5 rounded-xl text-xs font-black bg-white text-slate-700 hover:bg-slate-100 border border-slate-200 transition';
  }
}

// Navigation & Tab Switching
function selectUnit(unitId) {
  activeUnitId = unitId;
  selectedVocabIdx = 0;
  currentQuizIdx = 0;
  quizScore = 0;
  quizAnswered = false;
  selectedQuizOption = null;
  stopAudio();
  renderUnitNav();
  renderUnitBanner();
  renderContent();
}

function switchTab(tabName) {
  activeTab = tabName;
  stopAudio();
  const tabs = ['vocab', 'sentences', 'grammar', 'practice', 'quiz'];
  tabs.forEach(t => {
    const btn = document.getElementById('tab-btn-' + t);
    if (btn) {
      if (t === tabName) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }
  });
  renderContent();
}

function currentUnit() {
  return APP_UNITS.find(u => u.id === activeUnitId) || APP_UNITS[0];
}

function selectVocabWord(idx) {
  selectedVocabIdx = idx;
  const u = currentUnit();
  if (u && u.vocab[idx]) {
    playAudio(u.vocab[idx].word);
  }
  renderContent();
  const showcase = document.getElementById('big-vocab-showcase');
  if (showcase && window.innerWidth < 640) {
    showcase.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function nextWord() {
  const u = currentUnit();
  selectedVocabIdx = (selectedVocabIdx + 1) % u.vocab.length;
  playAudio(u.vocab[selectedVocabIdx].word);
  renderContent();
}

function prevWord() {
  const u = currentUnit();
  selectedVocabIdx = (selectedVocabIdx - 1 + u.vocab.length) % u.vocab.length;
  playAudio(u.vocab[selectedVocabIdx].word);
  renderContent();
}

function playAudioCurrentWord() {
  const u = currentUnit();
  const v = u.vocab[selectedVocabIdx];
  if (v) playAudio(v.word);
}

function playAudioCurrentSentence() {
  const u = currentUnit();
  const v = u.vocab[selectedVocabIdx];
  if (v && v.example) playAudio(v.example);
}

// Render Header & Navigation
function renderUnitNav() {
  const nav = document.getElementById('unit-nav');
  if (!nav) return;

  nav.innerHTML = APP_UNITS.map(u => {
    const isActive = u.id === activeUnitId;
    return `
      <button onclick="selectUnit(${u.id})" class="unit-tab p-3 rounded-2xl font-black text-xs sm:text-sm flex items-center justify-center gap-1.5 transition ${isActive ? 'active' : 'bg-white text-slate-700 hover:bg-slate-50 border border-slate-200 shadow-sm'}">
        <span class="text-base sm:text-lg">${u.icon}</span>
        <span>Unit ${u.id}</span>
      </button>
    `;
  }).join('');
}

function renderUnitBanner() {
  const banner = document.getElementById('unit-banner');
  if (!banner) return;
  const u = currentUnit();
  banner.className = `bg-gradient-to-r ${u.themeColor} rounded-3xl p-5 sm:p-6 text-white shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3`;
  banner.innerHTML = `
    <div>
      <span class="inline-block px-2.5 py-0.5 bg-white/20 rounded-md text-xs font-bold uppercase tracking-wide">Chương trình Tiếng Anh 5 Global Success</span>
      <h2 class="text-xl sm:text-2xl font-black mt-1">${u.title}</h2>
      <p class="text-xs sm:text-sm text-white/90 font-medium">${u.subtitle}</p>
    </div>
    <div id="unit-progress-badge" class="bg-white/20 backdrop-blur-md px-3.5 py-2 rounded-2xl text-xs font-black flex items-center gap-2">
      <span>⭐ Tiến độ: Đang tải...</span>
    </div>
  `;
  updateProgressDisplay();
}

function updateProgressDisplay() {
  const badge = document.getElementById('unit-progress-badge');
  if (!badge) return;
  const u = currentUnit();
  const set = getLearnedSet();
  
  let total = u.vocab.length + u.sentences.length + u.practice.length;
  let done = 0;

  u.vocab.forEach(v => { if (set.has('u' + u.id + '_v_' + v.word)) done++; });
  u.sentences.forEach((s, idx) => { if (set.has('u' + u.id + '_s_' + idx)) done++; });
  u.practice.forEach((p, idx) => { if (set.has('u' + u.id + '_p_' + idx)) done++; });

  badge.innerHTML = `⭐ Đã thuộc: ${done}/${total} mục (${Math.round((done/total)*100)}%)`;
}

// Toggle Practice Answer
function togglePracticeAnswer(idx) {
  const ansEl = document.getElementById('practice-ans-' + idx);
  const btnEl = document.getElementById('practice-btn-' + idx);
  if (!ansEl) return;
  if (ansEl.classList.contains('hidden')) {
    ansEl.classList.remove('hidden');
    if (btnEl) btnEl.innerHTML = '<span>Ẩn đáp án</span>';
  } else {
    ansEl.classList.add('hidden');
    if (btnEl) btnEl.innerHTML = '<span>👁️ Xem đáp án &amp; Phát âm</span>';
  }
}

// Interactive Quiz Game Functions
function answerQuiz(optIdx) {
  if (quizAnswered) return;
  quizAnswered = true;
  selectedQuizOption = optIdx;

  const u = currentUnit();
  const curQ = u.quiz[currentQuizIdx];
  const isCorrect = (optIdx === curQ.ans);

  if (isCorrect) {
    quizScore++;
  }

  renderContent();
}

function nextQuizQuestion() {
  const u = currentUnit();
  quizAnswered = false;
  selectedQuizOption = null;
  currentQuizIdx++;
  renderContent();
}

function restartQuiz() {
  currentQuizIdx = 0;
  quizScore = 0;
  quizAnswered = false;
  selectedQuizOption = null;
  renderContent();
}

// Render Content Views

  if (!main) return;

  const u = currentUnit();

  if (activeTab === 'vocab') {
    const curV = u.vocab[selectedVocabIdx] || u.vocab[0];
    const vId = 'u' + u.id + '_v_' + curV.word;

        <!-- Word Selector Carousel Pills -->

          <div class="flex items-center justify-between px-1">
            <span class="text-xs font-black uppercase text-slate-500 tracking-wider">👉 Chọn nhanh từ vựng để chiếu (${u.vocab.length} từ):</span>

            ${u.vocab.map((v, idx) => {

                  isCur 
                    ? 'active-word-pill' 
                    : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'
                }">
                  <span>${v.icon}</span>
                  <span>${v.word}</span>
                  ${vLearned ? '<span class="text-emerald-500 font-bold">✓</span>' : ''}
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- ======================================================== -->
        <!-- CHÍNH XÁC CẤU TRÚC THẺ TIẾNG TRUNG: THẺ HÌNH BỰ KHỔNG LỒ -->
        <!-- ======================================================== -->
        <div id="big-vocab-showcase" class="bg-white rounded-3xl p-4 sm:p-6 shadow-xl border-2 border-indigo-200/80 space-y-5">
          
          <!-- Header Status Bar -->
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">

              <span class="text-xs font-black uppercase tracking-wider px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full">

          <!-- 1. HÌNH ẢNH MINH HỌA BỰ (100% BỀ NGANG THẺ, CAO 280px - 340px) -->

            <div class="relative w-full h-64 sm:h-80 md:h-96 rounded-2xl sm:rounded-3xl overflow-hidden shadow-md border-2 border-slate-200 bg-slate-100 flex items-center justify-center">
              
              <!-- Large Image Layer -->
              <img id="main-large-img" src="${curV.imgUrl}" data-fallback="${curV.fallbackUrl || ''}" onerror="if(this.dataset.fallback && this.src !== this.dataset.fallback){ this.src = this.dataset.fallback; }" alt="${curV.word}" class="w-full h-full object-cover transition-all duration-300" />

              <!-- Top-Left Badge: Word + IPA -->
              <div class="absolute top-3 left-3 px-3.5 py-1.5 bg-slate-900/85 backdrop-blur-md text-white rounded-2xl text-xs sm:text-sm font-black flex items-center gap-2 shadow-lg border border-white/20">
                <span>${curV.icon}</span>
                <span class="tracking-wide uppercase">${curV.word} (${curV.ipa})</span>
                <span class="text-amber-300">•</span>
                <span class="text-amber-300 uppercase">${curV.meaning}</span>
              </div>

              <!-- Bottom-Left Badge: Mẹo Nhớ Nhỏ -->
              <div class="absolute bottom-3 left-3 px-3 py-1 bg-black/75 backdrop-blur-md text-white/95 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md border border-white/10 max-w-[70%] truncate">
                <span>💡</span>
                <span>${curV.tip}</span>
              </div>

              <!-- Audio Button Right on the Picture -->
              <button onclick="playAudioCurrentWord()" class="pulse-btn absolute bottom-3 right-3 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs sm:text-sm font-black flex items-center gap-1.5 shadow-lg transition">
                <span>🔊</span>
                <span>Bấm Nghe</span>
              </button>
            </div>
            <p class="text-center text-xs text-slate-400 font-extrabold uppercase tracking-wider">Tranh minh họa cỡ lớn cho học sinh ngồi bàn cuối vẫn nhìn thấy rõ</p>
          </div>

          <!-- 2. KHUNG TIÊU ĐỀ TỪ VỰNG TO RÕ RÀNG -->
          <div class="bg-indigo-50/70 p-4 sm:p-5 rounded-2xl border border-indigo-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="space-y-0.5">
              <div class="flex items-baseline gap-3 flex-wrap">
                <h2 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight">${curV.word}</h2>
                <span class="text-sm font-black px-3 py-0.5 rounded-lg bg-indigo-200 text-indigo-800">(${curV.pos})</span>
                <span class="text-base sm:text-lg font-bold text-slate-500 font-mono">${curV.ipa}</span>
              </div>
              <div class="text-xl sm:text-2xl font-black text-indigo-700">${curV.meaning}</div>
            </div>

            <!-- Pronunciation Audio Buttons -->
            <div class="flex items-center gap-2">
              <button onclick="playAudioCurrentWord()" class="pulse-btn px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs sm:text-sm font-black flex items-center gap-1.5 shadow-xs transition">
                <span>🔊 Đọc từ</span>
              </button>
              <button onclick="playAudioCurrentSentence()" class="pulse-btn px-3.5 py-2.5 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 transition">
                <span>🎧 Đọc câu</span>
              </button>
            </div>
          </div>

          <!-- 3. KHUNG VÀNG KEM: THƠ LỤC BÁT & LIÊN TƯỞNG NHỚ TỪ -->
          <div class="bg-[#fffbeb] border-2 border-[#fef3c7] rounded-3xl p-4 sm:p-5 space-y-3 text-slate-800 shadow-xs">
            <div class="flex items-center gap-2 text-xs font-black text-amber-900 uppercase tracking-wide">
              <span class="text-base">📜</span>
              <span>Thơ Lục Bát &amp; Mẹo Liên Tưởng Nhớ Từ</span>
            </div>

            <!-- Câu Thơ Lục Bát To Rõ Đậm Màu Nâu/Đỏ -->
            <div class="text-base sm:text-xl font-black text-amber-950 italic whitespace-pre-line leading-relaxed pl-3.5 border-l-4 border-amber-400 bg-white/70 p-3.5 rounded-2xl shadow-2xs">
${curV.rhyme}
            </div>

            <!-- Mẹo Liên Tưởng Dễ Hiểu -->
            <div class="text-xs sm:text-sm text-amber-950 font-semibold leading-relaxed pt-1">
              ${curV.mnemonic}
            </div>
          </div>

          <!-- 4. CÂU VÍ DỤ THỰC TẾ TRONG SGK -->
          <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-1">
            <span class="text-xs font-black uppercase text-slate-400 tracking-wider">Câu ví dụ áp dụng trong giao tiếp:</span>
            <div class="text-sm sm:text-base font-black text-slate-800">
              "${curV.example}"
            </div>
            ${curV.exampleIpa ? `
              <div class="text-xs sm:text-sm font-mono font-bold text-indigo-700 bg-indigo-50/90 px-3 py-1 rounded-xl border border-indigo-200/80 inline-block shadow-2xs">
                🗣️ ${curV.exampleIpa}
              </div>
            ` : ''}
            <div class="text-xs text-slate-500 font-semibold italic">
              ${curV.exampleVi}
            </div>
          </div>

          <!-- 5. NÚT CHUYỂN TỪ TRÌNH CHIẾU TIẾP THEO -->
          <div class="flex items-center justify-between pt-2 border-t border-slate-100">
            <button onclick="prevWord()" class="pulse-btn px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-black flex items-center gap-1.5 transition">
              <span>◀ Từ Trước</span>
            </button>
            <span class="text-xs text-slate-400 font-bold hidden sm:inline">Dùng phím Mũi tên ◀ ▶ trên bàn phím để chuyển từ</span>
            <button onclick="nextWord()" class="pulse-btn px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-black flex items-center gap-1.5 shadow-sm transition">
              <span>Từ Tiếp Theo ▶</span>
            </button>
          </div>

        </div>

      </div>
    `;
  } else if (activeTab === 'sentences') {
    main.innerHTML = `
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-sm sm:text-base font-black text-slate-800">🗣️ Mẫu Câu Trọng Tâm Có Tranh Minh Họa</h3>
          <span class="text-xs text-slate-500 font-bold">Nghe từng cụm giúp học sinh nói chuẩn ngữ điệu bản xứ</span>
        </div>
        <div class="space-y-4">
          ${u.sentences.map((s, idx) => {
            const sId = 'u' + u.id + '_s_' + idx;
            const learned = isLearned(sId);
            return `
              <div class="bg-white rounded-3xl p-4 sm:p-6 border border-slate-200 shadow-md space-y-4">
                
                <!-- Hai cột: Tranh minh họa bối cảnh (trái) & Mẫu câu đối thoại (phải) -->
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                  
                  <!-- Tranh bối cảnh (5 cols) -->
                  <div class="md:col-span-5">
                    <div class="w-full h-44 sm:h-52 rounded-2xl overflow-hidden shadow-sm border border-slate-200 bg-slate-100">
                      <img src="${s.imgUrl}" alt="${s.en}" class="w-full h-full object-cover" />
                    </div>
                  </div>

                  <!-- Nội dung câu & Nút nghe (7 cols) -->
                  <div class="md:col-span-7 space-y-3">
                    <div class="flex items-start justify-between gap-3">
                      <div class="space-y-1.5">
                        <div class="text-base sm:text-lg font-black text-slate-900 leading-snug">${s.en}</div>
                        ${s.ipa ? `<div class="text-xs sm:text-sm font-mono font-bold text-indigo-700 bg-indigo-50/90 px-3 py-1 rounded-xl border border-indigo-200/80 inline-block shadow-2xs">🗣️ Phiên âm IPA: <span class="font-bold text-indigo-900 tracking-wide">${s.ipa}</span></div>` : ''}
                        <div class="text-sm sm:text-base font-extrabold text-indigo-600">${s.vi}</div>
                      </div>
                    </div>
                    <button onclick="playAudio('${s.en.replace(/'/g, "\\'")}'); saveLearned('${sId}')" class="pulse-btn px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs sm:text-sm font-black flex items-center gap-1.5 shadow-sm transition">
                      <span>🔊 Nghe Cả Câu Chuẩn Bản Xứ</span>
                    </button>
                  </div>

                </div>

                <!-- Chunks breakdown (Tách cụm luyện nói) -->
                <div class="bg-slate-50 rounded-2xl p-3.5 border border-slate-200 space-y-2">
                  <div class="text-xs font-black text-slate-500 uppercase tracking-wider">🎧 Tách nhỏ từng cụm để học sinh nhại lại theo nhịp:</div>
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    ${s.chunks.map(c => `
                      <button onclick="playAudio('${c.en.replace(/'/g, "\\'")}')" class="pulse-btn p-2.5 rounded-xl bg-white border border-slate-200 hover:border-indigo-300 text-left transition flex items-center justify-between gap-2 shadow-2xs">
                        <div>
                          <div class="text-xs font-black text-slate-800">${c.en}</div>
                          ${c.phoneticVi ? `<div class="text-[11px] font-bold text-amber-600 italic">đọc: ${c.phoneticVi}</div>` : ''}
                          <div class="text-2xs text-slate-500 font-semibold">${c.vi}</div>
                        </div>
                        <span class="text-xs text-indigo-500">🔊</span>
                      </button>
                    `).join('')}
                  </div>
                </div>

              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  } else if (activeTab === 'grammar') {
    main.innerHTML = `
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-sm sm:text-base font-black text-slate-800">💡 Góc Ngữ Pháp Trực Quan (Infographic)</h3>
          <span class="text-xs text-slate-500 font-bold">Quy tắc ngắn gọn, dễ nhớ kèm ví dụ thực tế</span>
        </div>

        <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-md space-y-5">
          <div class="space-y-1 border-b border-slate-100 pb-3">
            <h4 class="text-lg sm:text-xl font-black text-indigo-700 flex items-center gap-2">
              <span>📌</span>
              <span>${u.grammar.title}</span>
            </h4>
            <p class="text-xs sm:text-sm text-slate-600 font-semibold">${u.grammar.summary}</p>
          </div>

          <!-- Cards Grid with Illustrations -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            ${u.grammar.rules.map(r => `
              <div class="p-4 sm:p-5 rounded-3xl border-2 ${r.color} space-y-3 shadow-md flex flex-col justify-between bg-white">
                <div class="space-y-3">
                  <span class="text-xs font-black uppercase tracking-wider px-3 py-1 rounded-lg bg-indigo-100/80 text-indigo-900 inline-block">${r.label}</span>
                  ${r.imgUrl ? `
                    <div class="w-full h-44 sm:h-52 rounded-2xl overflow-hidden border border-slate-200/80 shadow-inner bg-slate-100 flex items-center justify-center">
                      <img src="${r.imgUrl}" alt="${r.label}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                    </div>
                  ` : ''}
                  <div class="text-sm sm:text-base font-black text-slate-900 bg-slate-50 p-3 rounded-xl border border-slate-200/80 shadow-2xs">
                    💬 "${r.example}"
                  </div>
                </div>
                <div class="text-xs sm:text-sm font-bold leading-relaxed text-slate-700 bg-indigo-50/50 p-3 rounded-xl border border-indigo-100 mt-2">
                  ✨ <strong>Quy tắc:</strong> ${r.rule}
                </div>
              </div>
            `).join('')}
          </div>

          <!-- Tip Box -->
          <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 text-xs sm:text-sm text-amber-950 font-black leading-relaxed flex items-start gap-2.5 shadow-2xs">
            <span class="text-xl">💡</span>
            <div class="pt-0.5">${u.grammar.tip}</div>
          </div>
        </div>
      </div>
    `;
  } else if (activeTab === 'practice') {
    main.innerHTML = `
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-sm sm:text-base font-black text-slate-800">🎯 Dịch Câu Thuộc Lòng (Thử Thách Phản Xạ)</h3>
          <span class="text-xs text-slate-500 font-bold">Học sinh nhìn tranh và tự nói tiếng Anh trước khi mở đáp án</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${u.practice.map((p, idx) => {
            const pId = 'u' + u.id + '_p_' + idx;
            const learned = isLearned(pId);
            return `
              <div class="bg-white rounded-3xl p-4 sm:p-5 border border-slate-200 shadow-md space-y-3 flex flex-col justify-between">
                
                <div class="space-y-2.5">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-indigo-600 uppercase tracking-wider">Câu hỏi ${idx + 1}</span>
                    <button onclick="saveLearned('${pId}')" class="text-xs font-bold text-slate-400 hover:text-amber-500">
                      ${learned ? '⭐ Đã thuộc' : '☆ Đánh dấu'}
                    </button>
                  </div>

                  <!-- Tranh gợi ý phản xạ -->
                  <div class="w-full h-36 rounded-2xl overflow-hidden shadow-2xs border border-slate-200 bg-slate-100">
                    <img src="${p.imgUrl}" alt="${p.en}" class="w-full h-full object-cover" />
                  </div>

                  <!-- Câu hỏi Tiếng Việt -->
                  <div class="text-sm sm:text-base font-black text-slate-900 leading-snug">
                    🇻🇳 ${p.vi}
                  </div>
                </div>

                <!-- Khung mở đáp án -->
                <div class="space-y-2 pt-2 border-t border-slate-100">
                  <div id="practice-ans-${idx}" class="hidden space-y-2">
                    <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-xs sm:text-sm font-black text-emerald-900">
                      🇬🇧 ${p.en}
                    </div>
                    <div class="flex items-center justify-between gap-2">
                      <span class="text-2xs text-slate-500 font-semibold italic">💡 ${p.tip}</span>
                      <button onclick="playAudio('${p.en.replace(/'/g, "\\'")}')" class="pulse-btn px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-black flex items-center gap-1 shadow-2xs">
                        <span>🔊 Phát âm</span>
                      </button>
                    </div>
                  </div>

                  <button id="practice-btn-${idx}" onclick="togglePracticeAnswer(${idx})" class="w-full py-2.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5">
                    <span>👁️ Xem đáp án &amp; Phát âm</span>
                  </button>
                </div>

              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  } else if (activeTab === 'quiz') {
    const curQ = u.quiz[currentQuizIdx];
    const isFinished = (currentQuizIdx >= u.quiz.length);

    if (isFinished) {
      main.innerHTML = `
        <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-xl text-center space-y-5 max-w-xl mx-auto">
          <div class="text-6xl animate-bounce">🎉</div>
          <div class="space-y-1">
            <h3 class="text-2xl sm:text-3xl font-black text-slate-900">Hoan Hô! Em Đã Xuất Sắc Hoàn Thành!</h3>
            <p class="text-sm text-slate-500 font-bold">Thử thách ôn tập kiến thức ${u.title}</p>
          </div>

          <div class="p-5 bg-gradient-to-r from-amber-50 to-orange-50 border-2 border-amber-300 rounded-3xl space-y-2">
            <div class="text-xs uppercase font-black text-amber-800 tracking-wider">Kết Quả Điểm Số Của Em:</div>
            <div class="text-4xl sm:text-5xl font-black text-amber-600">
              ${quizScore} / ${u.quiz.length} ⭐
            </div>
            <p class="text-xs sm:text-sm font-bold text-amber-900">
              ${quizScore === u.quiz.length ? 'Xuất sắc tuyệt đối! Em nhớ bài rất siêu!' : 'Rất tốt! Em hãy tiếp tục rèn luyện thêm nhé!'}
            </p>
          </div>

          <div class="flex items-center justify-center gap-3 pt-2">
            <button onclick="restartQuiz()" class="pulse-btn px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl text-sm shadow-md transition flex items-center gap-2">
              <span>🔄 Chơi Lại Lượt Mới</span>
            </button>
            <button onclick="switchTab('vocab')" class="pulse-btn px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black rounded-2xl text-sm transition flex items-center gap-2">
              <span>📚 Quay Lại Ôn Từ Vựng</span>
            </button>
          </div>
        </div>
      `;
      return;
    }

    main.innerHTML = `
      <div class="bg-white rounded-3xl p-5 sm:p-7 border border-slate-200 shadow-xl space-y-6 max-w-2xl mx-auto">
        
        <!-- Header: Question Count & Stars -->
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <div class="flex items-center gap-2">
            <span class="px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-black rounded-full uppercase tracking-wider">
              🎮 Câu hỏi ${currentQuizIdx + 1} / ${u.quiz.length}
            </span>
          </div>
          <div class="flex items-center gap-1 text-sm font-black text-amber-500">
            <span>⭐ ${quizScore * 10} điểm</span>
          </div>
        </div>

        <!-- Question Prompt, Illustration & Sound -->
        <div class="space-y-4 text-center">
          ${curQ.imgUrl ? `
            <div class="w-full max-w-md mx-auto h-48 sm:h-64 rounded-2xl sm:rounded-3xl overflow-hidden border-2 border-indigo-200 shadow-md bg-slate-100 flex items-center justify-center">
              <img src="${curQ.imgUrl}" alt="Hình gợi ý câu hỏi" class="w-full h-full object-cover hover:scale-105 transition duration-300">
            </div>
          ` : ''}
          <div class="space-y-2.5">
            <h4 class="text-lg sm:text-xl font-black text-slate-900 leading-snug">
              ${curQ.q}
            </h4>
            <button onclick="playAudio('${curQ.audio.replace(/'/g, "\\'")}')" class="pulse-btn px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-xs sm:text-sm font-black inline-flex items-center gap-2 shadow-md transition">
              <span>🔊 Bấm Nghe Phát Âm Gợi Ý</span>
            </button>
          </div>
        </div>

        <!-- 4 Options Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
          ${curQ.options.map((opt, oIdx) => {
            let btnClass = "p-4 rounded-2xl border-2 text-left font-black text-sm sm:text-base transition flex items-center justify-between ";
            
            if (!quizAnswered) {
              btnClass += "bg-slate-50 hover:bg-indigo-50 hover:border-indigo-400 text-slate-800 border-slate-200 cursor-pointer";
            } else {
              if (oIdx === curQ.ans) {
                btnClass += "bg-emerald-100 border-emerald-500 text-emerald-900 shadow-md ring-2 ring-emerald-400";
              } else if (oIdx === selectedQuizOption) {
                btnClass += "bg-rose-100 border-rose-500 text-rose-900";
              } else {
                btnClass += "bg-slate-100 border-slate-200 text-slate-400 opacity-60";
              }
            }

            return `
              <button onclick="answerQuiz(${oIdx})" class="pulse-btn ${btnClass}">
                <div class="flex items-center gap-2.5">
                  <span class="w-7 h-7 rounded-full bg-white border border-slate-300 text-xs flex items-center justify-center font-bold text-slate-600">${String.fromCharCode(65 + oIdx)}</span>
                  <span>${opt}</span>
                </div>
                ${quizAnswered && oIdx === curQ.ans ? '<span class="text-emerald-600 text-lg">✓</span>' : ''}
                ${quizAnswered && oIdx === selectedQuizOption && oIdx !== curQ.ans ? '<span class="text-rose-600 text-lg">✕</span>' : ''}
              </button>
            `;
          }).join('')}
        </div>

        <!-- Explanation & Next Button (when answered) -->
        ${quizAnswered ? `
          <div class="p-4 rounded-2xl ${selectedQuizOption === curQ.ans ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-rose-50 border border-rose-200 text-rose-900'} space-y-2">
            <div class="text-xs font-black uppercase tracking-wider">
              ${selectedQuizOption === curQ.ans ? '🎉 CHÍNH XÁC! TUYỆT VỜI!' : '💡 CHƯA ĐÚNG RỒI, BÉ XEM GIẢI THÍCH NHÉ:'}
            </div>
            <div class="text-xs sm:text-sm font-bold">
              ${curQ.explain}
            </div>
            <div class="flex justify-end pt-2">
              <button onclick="nextQuizQuestion()" class="pulse-btn px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs sm:text-sm font-black shadow-md transition flex items-center gap-1.5">
                <span>Câu Tiếp Theo ▶</span>
              </button>
            </div>
          </div>
        ` : ''}

      </div>
    `;
  }
}

// Keyboard shortcuts for wireless clickers & presentation remotes
window.addEventListener('keydown', (e) => {
  if (activeTab === 'vocab') {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') {
      nextWord();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      prevWord();
    } else if (e.key === ' ') {
      playAudioCurrentWord();
    }
  }
});

// Initial boot
window.addEventListener('DOMContentLoaded', () => {
  renderUnitNav();
  renderUnitBanner();
  renderContent();
});

  </script>
</body>
</html>
