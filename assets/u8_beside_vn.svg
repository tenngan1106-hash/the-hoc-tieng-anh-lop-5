<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#f0fdf4"/>
  <rect x="40" y="32" width="880" height="476" rx="32" fill="#ffffff" stroke="#10b981" stroke-width="6"/>
  <!-- Wooden Desk Surface -->
  <rect x="110" y="325" width="740" height="36" rx="10" fill="#d97706" stroke="#92400e" stroke-width="5"/>
  <rect x="150" y="361" width="32" height="65" fill="#92400e"/>
  <rect x="778" y="361" width="32" height="65" fill="#92400e"/>
  <!-- Left: Blue Notebook -->
  <rect x="200" y="165" width="180" height="160" rx="14" fill="#3b82f6" stroke="#1e40af" stroke-width="6"/>
  <rect x="230" y="195" width="120" height="44" rx="8" fill="#ffffff"/>
  <text x="290" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#1e40af">BOOK</text>
  <!-- Double Arrow showing BESIDE -->
  <line x1="410" y1="245" x2="540" y2="245" stroke="#059669" stroke-width="14" stroke-linecap="round"/>
  <polygon points="392,245 426,222 426,268" fill="#059669"/>
  <polygon points="558,245 524,222 524,268" fill="#059669"/>
  <text x="475" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#059669">BESIDE</text>
  <!-- Right: Red Pencil Case -->
  <rect x="575" y="225" width="195" height="100" rx="22" fill="#f43f5e" stroke="#be123c" stroke-width="6"/>
  <line x1="590" y1="262" x2="755" y2="262" stroke="#fde047" stroke-width="6" stroke-dasharray="10 6"/>
  <text x="672" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff">PENCIL CASE</text>
  <!-- Badge -->
  <rect x="230" y="438" width="500" height="56" rx="16" fill="#059669"/>
  <text x="480" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff">↔️ BESIDE · Ở ngay bên cạnh</text>
</svg>