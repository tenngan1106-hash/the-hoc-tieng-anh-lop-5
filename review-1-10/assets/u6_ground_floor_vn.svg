<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
  <rect y="455" width="960" height="85" fill="#4ade80"/>
  <rect y="450" width="960" height="12" fill="#22c55e"/>
  <!-- Roof -->
  <polygon points="140,120 480,36 820,120" fill="#dc2626" stroke="#991b1b" stroke-width="5"/>
  <rect x="370" y="72" width="220" height="36" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="480" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#991b1b">PRIMARY SCHOOL</text>
  <!-- Building Body -->
  <rect x="170" y="120" width="620" height="335" fill="#fefce8" stroke="#cbd5e1" stroke-width="4"/>
  <!-- Second Floor (dimmed) -->
  <rect x="180" y="130" width="600" height="96" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="215" y="185" font-family="Arial, sans-serif" font-weight="800" font-size="22" fill="#64748b">2F · Second Floor</text>
  <rect x="520" y="148" width="110" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="575" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#64748b">Art Room</text>
  <rect x="650" y="148" width="110" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="705" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#64748b">Music Room</text>
  <!-- First Floor (dimmed) -->
  <rect x="180" y="238" width="600" height="96" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="215" y="293" font-family="Arial, sans-serif" font-weight="800" font-size="22" fill="#64748b">1F · First Floor</text>
  <rect x="520" y="256" width="110" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="575" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#64748b">Library</text>
  <rect x="650" y="256" width="110" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="705" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#64748b">Class 5A</text>
  <!-- Ground Floor (HIGHLIGHTED) -->
  <rect x="176" y="344" width="608" height="106" rx="12" fill="url(#glow)" stroke="#b45309" stroke-width="5"/>
  <rect x="200" y="362" width="290" height="70" rx="12" fill="#ffffff"/>
  <text x="345" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="26" fill="#b45309">GROUND FLOOR</text>
  <text x="345" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="18" fill="#0f172a">Tầng trệt (sát mặt đất)</text>
  <!-- Door -->
  <rect x="520" y="364" width="90" height="84" rx="8" fill="#7c2d12" stroke="#451a03" stroke-width="3"/>
  <circle cx="595" cy="408" r="5" fill="#fde047"/>
  <rect x="635" y="364" width="125" height="68" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
  <text x="697" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#78350f">Computer Room</text>
  <!-- Arrow Pointer -->
  <polygon points="65,397 125,365 125,383 165,383 165,411 125,411 125,429" fill="#ea580c" transform="rotate(180 115 397)"/>
  <text x="90" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#c2410c">TẦNG TRỆT</text>
</svg>